<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Register</title>
        <link rel="stylesheet" href="css/register.css">
    </head>
    <body>
        <main class="auth-layout">
        <div class="auth-intro"><span class="eyebrow">PRIVATE NETWORK / 02</span><h1>Bring your<br><em>circle</em><br>closer.</h1><p>Start a private space for the conversations that matter.</p></div>
        <div class="register-container">
            <span class="eyebrow">NEW ACCOUNT</span><h2>Create your RChat account</h2><p class="form-note">It only takes a minute to get started.</p>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    />
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        required
                    />
                </div>
                <button type="submit" class="register-button">Register</button>
            </form>
            <p id="form-status" class="form-status" role="alert"></p>
        </div>
        </main>

        <script src="/socket.io/socket.io.js"></script>
        <script src="js/register.js"></script>
    </body>
</html>
